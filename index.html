<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework1</title>

    <!-- Connects the CSS file to the HTML page -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navigation bar with links to all main pages -->
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="addPost.html">Add Post</a>
        <a href="login.html">Log in</a>

    <!-- Main content containing five different posts -->
    <main>
      <!-- First post with user information, image, text and reaction button -->
      <article>
        <div class="post-header">
          <div class="user-info">
            <img src="kotik.jpg" alt="Profile picture" />
            <span class="username">@kissa</span>

          <span>Sept 30, 2026 17:13</span>
        </div>

        <img class="post-image" src="catwithhomies.jpg" alt="Cat with dogs" />

      <!-- Second post without an image -->
      <article>
        <div class="post-header">
          <div class="user-info">
            <img src="cat2.jpg" alt="Cat profile picture" />
            <span class="username">@karen</span>
          </div>

          <span>Sept 30, 2026 18:00</span>
        </div>

        <p>So nobody thought to invite me? Good to know.</p>
        <button class="reaction">❤️</button>
      </article>

      <!-- Third post with an image -->
      <article>
        <div class="post-header">
          <div class="user-info">
            <img src="kotik.jpg" alt="Profile picture" />
            <span class="username">@kissa</span>
          </div>

          <span>Sept 30, 2026 18:24</span>
        </div>

        <img class="post-image" src="post3.jpg" alt="Cat outdoors" />
        <p>@karen your absence was part of the plan</p>
        <button class="reaction">❤️</button>
      </article>

      <!-- Fourth post -->
      <article>
        <p>Post 4</p>
      </article>

      <!-- Fifth post -->
      <article>
        <p>Post 5</p>
      </article>

    <!-- Bottom section of the page -->
    <footer>
      <p>© 2026 Catwitter</p>
    </footer>

</html>
