<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Post</title>

    <!-- Connects the CSS file to the HTML page -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navigation bar -->
    <header>
      <nav>
        <a href="index.html">Home</a>
      </nav>
    </header>

    <!-- Main section for creating a new post -->
    <main>
      <article class="add-post">
        <!-- Form redirects to the home page after creating a post -->
        <form action="index.html">
          <label for="post-body">Post body</label>
          <textarea
            id="post-body"
            name="post-body"
            placeholder="Enter post text"
          ></textarea>

          <label for="post-image">Select file</label>
          <input
            type="file"
            id="post-image"
            name="post-image"
            accept="image/*"
          />

          <button type="submit">Create post</button>
        </form>
      </article>
    </main>
  </body>
</html>
